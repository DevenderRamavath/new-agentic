<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f8f5" />
  <title>Daylist — Simple Todo</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#253c37;background:#f6f8f5;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.login-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 10%,#edf4ea 0,transparent 60%),#f7f8f5}.login-card{width:min(100%,420px);padding:44px 42px;background:#fff;border:1px solid #e9eee8;border-radius:22px;box-shadow:0 18px 60px #304a3210}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#deefdf;color:#34714c;font-weight:700;font-size:22px}.eyebrow{margin:24px 0 8px;color:#7d9a82;font-size:10px;letter-spacing:.16em;font-weight:700}.login-card h1,.todo-content h1{font-size:34px;letter-spacing:-.045em;margin:0;font-weight:700}.muted{color:#83908a;margin:8px 0 0;font-size:14px}.login-card form{display:flex;flex-direction:column;margin-top:32px}.login-card label{font-size:12px;color:#45554e;font-weight:600;margin:0 0 8px}.login-card input,.add-form input{border:1px solid #e1e8e1;background:#fbfcfa;border-radius:10px;padding:13px 14px;color:#273a32;outline:none;transition:border .15s,box-shadow .15s}.login-card input{margin-bottom:19px}.login-card input:focus,.add-form input:focus{border-color:#86ae8b;box-shadow:0 0 0 3px #eaf3e9}.login-card input::placeholder,.add-form input::placeholder{color:#a8b2aa}.primary-button{border:0;border-radius:10px;background:#346b4d;color:#fff;font-size:13px;font-weight:600;padding:13px 17px;transition:background .15s,transform .15s}.primary-button:hover{background:#285a3f;transform:translateY(-1px)}.login-button{display:flex;align-items:center;justify-content:space-between;margin-top:3px}.login-button span{font-size:18px}.demo-hint{border-top:1px solid #edf0ec;margin:25px 0 0;padding-top:18px;text-align:center;color:#8a958e;font-size:11px;line-height:1.8}.demo-hint strong{color:#586a5f;font-weight:600}.error{color:#b7453f;font-size:12px;margin:-5px 0 13px}.todo-page{min-height:100vh;display:flex;flex-direction:column}.topbar{height:76px;border-bottom:1px solid #e9eee8;display:flex;align-items:center;justify-content:space-between;padding:0 max(calc((100vw - 1040px)/2),28px);background:#fbfcfa}.wordmark{text-decoration:none;display:flex;align-items:center;gap:10px;color:#2d4f3e;font-size:17px;font-weight:800;letter-spacing:-.04em}.brand-mark.small{width:29px;height:29px;border-radius:9px;font-size:16px}.logout-button{border:1px solid #e3eae2;background:transparent;color:#647269;border-radius:8px;padding:9px 12px;font-size:12px}.logout-button:hover{background:#eef4ed}.logout-button span{margin-left:7px}.todo-content{width:min(100% - 40px,690px);margin:75px auto 40px;flex:1}.todo-content .eyebrow{margin:0 0 9px}.todo-content h1{font-size:38px}.date-copy{margin-top:6px}.add-form{display:flex;gap:10px;margin:32px 0 20px}.add-form input{flex:1;min-width:0;background:white}.add-form button{white-space:nowrap}.add-form button span{font-size:16px;margin-left:7px}.list-card{background:#fff;border:1px solid #e7ece6;border-radius:14px;box-shadow:0 8px 30px #304a3208;overflow:hidden}.list-toolbar{display:flex;justify-content:space-between;align-items:center;padding:16px 19px;border-bottom:1px solid #edf0ec}.remaining{font-size:12px;color:#89948c}.remaining strong{color:#405b49;font-weight:700}.filters{display:flex;gap:3px}.filter{border:0;background:transparent;color:#89948c;font-size:11px;padding:7px 9px;border-radius:7px}.filter:hover{color:#3d654a}.active-filter{background:#edf5ec;color:#3b6749;font-weight:600}.todo-list{margin:0;padding:0 19px;list-style:none}.todo-item{display:flex;align-items:center;gap:12px;min-height:59px;border-bottom:1px solid #f0f2ef}.todo-item:last-child{border-bottom:0}.check-button{width:19px;height:19px;border:1.5px solid #cbd7ca;border-radius:50%;background:#fff;color:#fff;display:grid;place-items:center;flex:none;padding:0;font-size:12px}.check-button:hover{border-color:#6f9d75}.completed .check-button{background:#5b9365;border-color:#5b9365}.todo-title{font-size:13px;color:#46554c;flex:1;overflow-wrap:anywhere}.completed .todo-title{color:#a3ada5;text-decoration:line-through}.delete-button{border:0;background:transparent;color:#a2ada4;font-size:22px;line-height:1;padding:3px 5px;opacity:.6}.delete-button:hover{color:#bd5a50;opacity:1}.empty-state{min-height:185px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#87948a}.empty-icon{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:#f0f6ef;color:#729676;font-size:20px}.empty-state p{margin:13px 0 4px;color:#526258;font-size:13px;font-weight:600}.empty-state>span:last-child{font-size:11px}.list-footer{border-top:1px solid #edf0ec;padding:12px 19px;display:flex;justify-content:space-between;color:#a1aba2;font-size:10px}.list-footer span:last-child{color:#8da98d}.page-footer{text-align:center;padding:20px;color:#adb6ad;font-size:9px;letter-spacing:.18em}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){.login-card{padding:36px 25px}.topbar{height:65px;padding:0 20px}.todo-content{width:calc(100% - 32px);margin:51px auto 30px}.todo-content h1{font-size:33px}.add-form{gap:7px}.add-form input{padding:12px 10px;font-size:12px}.add-form button{padding:12px 11px;font-size:11px}.list-toolbar{padding:13px 12px}.filters{gap:0}.filter{padding:7px 6px;font-size:10px}.todo-list{padding:0 13px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;
    const DEMO_EMAIL = 'student@example.com';
    const DEMO_PASSWORD = 'password123';
    const STORAGE_KEY = 'simple-todo-items';

    function readTodos() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function Login({ onLogin }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');

      function handleSubmit(event) {
        event.preventDefault();
        if (!email.trim() || !password) return setError('Enter your email and password.');
        if (!/^\S+@\S+\.\S+$/.test(email.trim())) return setError('Enter a valid email address.');
        if (email.trim().toLowerCase() !== DEMO_EMAIL || password !== DEMO_PASSWORD) return setError('Email or password is incorrect.');
        onLogin();
      }

      return <main className="login-page"><section className="login-card">
        <div className="brand-mark" aria-hidden="true">✓</div>
        <p className="eyebrow">YOUR DAY, IN ORDER</p><h1>Welcome back</h1>
        <p className="muted">Sign in to see what’s on your list.</p>
        <form onSubmit={handleSubmit} noValidate>
          <label htmlFor="email">Email</label>
          <input id="email" type="email" autoComplete="username" placeholder="you@example.com" value={email} onChange={e => setEmail(e.target.value)} />
          <label htmlFor="password">Password</label>
          <input id="password" type="password" autoComplete="current-password" placeholder="Enter your password" value={password} onChange={e => setPassword(e.target.value)} />
          {error && <p className="error" role="alert">{error}</p>}
          <button className="primary-button login-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
        </form>
        <p className="demo-hint">Demo: <strong>student@example.com</strong><br />Password: <strong>password123</strong></p>
      </section></main>;
    }

    function TodoApp({ onLogout }) {
      const [todos, setTodos] = useState(readTodos);
      const [draft, setDraft] = useState('');
      const [filter, setFilter] = useState('All');
      useEffect(() => localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)), [todos]);
      const remaining = todos.filter(todo => !todo.completed).length;
      const visibleTodos = useMemo(() => todos.filter(todo => filter === 'All' || (filter === 'Active' ? !todo.completed : todo.completed)), [todos, filter]);

      function addTodo(event) {
        event.preventDefault();
        const title = draft.trim();
        if (!title) return;
        setTodos(current => [{ id: Date.now() + Math.random(), title, completed: false }, ...current]);
        setDraft('');
      }

      return <main className="todo-page">
        <header className="topbar"><span className="wordmark"><span className="brand-mark small">✓</span> daylist</span><button className="logout-button" onClick={onLogout}>Log out <span aria-hidden="true">↗</span></button></header>
        <section className="todo-content"><p className="eyebrow">A LITTLE PROGRESS ADDS UP</p><h1>Your tasks</h1><p className="muted date-copy">One thing at a time. You’ve got this.</p>
          <form className="add-form" onSubmit={addTodo}><label className="sr-only" htmlFor="new-todo">Add a task</label><input id="new-todo" value={draft} onChange={e => setDraft(e.target.value)} placeholder="What needs doing?" /><button className="primary-button" type="submit">Add task <span aria-hidden="true">+</span></button></form>
          <section className="list-card" aria-label="Todo list"><div className="list-toolbar"><span className="remaining"><strong>{remaining}</strong> {remaining === 1 ? 'task' : 'tasks'} left</span><div className="filters" aria-label="Filter tasks">{['All', 'Active', 'Completed'].map(option => <button key={option} className={filter === option ? 'filter active-filter' : 'filter'} onClick={() => setFilter(option)} aria-pressed={filter === option}>{option}</button>)}</div></div>
            {visibleTodos.length ? <ul className="todo-list">{visibleTodos.map(todo => <li className={todo.completed ? 'todo-item completed' : 'todo-item'} key={todo.id}><button className="check-button" onClick={() => setTodos(current => current.map(item => item.id === todo.id ? {...item, completed: !item.completed} : item))} aria-label={todo.completed ? `Mark ${todo.title} active` : `Complete ${todo.title}`} aria-pressed={todo.completed}>{todo.completed && <span aria-hidden="true">✓</span>}</button><span className="todo-title">{todo.title}</span><button className="delete-button" onClick={() => setTodos(current => current.filter(item => item.id !== todo.id))} aria-label={`Delete ${todo.title}`}>×</button></li>)}</ul> : <div className="empty-state"><span className="empty-icon" aria-hidden="true">{filter === 'Completed' ? '✳' : '＋'}</span><p>{filter === 'All' ? 'Your list is clear.' : `No ${filter.toLowerCase()} tasks right now.`}</p><span>{filter === 'All' ? 'Add a task above to get started.' : 'Try another filter or add a new task.'}</span></div>}
            <div className="list-footer"><span>Small steps count.</span><span aria-hidden="true">✳</span></div>
          </section>
        </section><footer className="page-footer">MADE FOR THE THINGS THAT MATTER</footer>
      </main>;
    }

    function App() {
      const [loggedIn, setLoggedIn] = useState(false);
      return loggedIn ? <TodoApp onLogout={() => setLoggedIn(false)} /> : <Login onLogin={() => setLoggedIn(true)} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
